apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: practica-s12
  labels:
    app: cloud-sec-app
    environment: aws-cloud
  annotations:
    # Descomentar en AWS EKS para aprovisionamiento automático de ELB/NLB:
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    description: "Exposición segura del servicio Cloud en AWS VPC (NodePort 30092 -> Pod 8080; compatible con LoadBalancer ELB)"
spec:
  # En clúster AWS EKS con LoadBalancer cambiar a: type: LoadBalancer
  # En nodos EC2 (K3s/kubeadm) o Minikube, NodePort 30092 requiere abrir TCP 30092 en el Security Group de AWS VPC
  type: NodePort
  selector:
    app: cloud-sec-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30092
